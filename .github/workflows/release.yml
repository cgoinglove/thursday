name: Release

# Nobody tags anything by hand. Every push to main updates one open "Release PR"
# that carries the next version and the changelog it earned; merging that PR is
# the decision to release, and everything below happens from it.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keeps the Release PR in step with main. On the push that merges it, this
  # tags the commit, publishes the GitHub Release, and says so in `released`.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only on the run that created a release. A tag written with the default token
  # starts no workflow of its own, so npm is published from here rather than
  # from a `push: tags` trigger that would never fire.
  publish:
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Signs the package with a link back to this commit; npm shows the badge.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Lints, type checks, builds and writes dist/package.json — the same gates
      # a local `pnpm release` runs, defined once (scripts/pack.mts).
      - run: node scripts/pack.mts

      # release-please bumped package.json in the commit being built, so the tag
      # and the tarball cannot disagree; check it anyway, since a mismatch is
      # permanent once published.
      - name: Tag matches the version
        run: |
          tagged="${TAG#v}"
          packed="$(node -p "require('./dist/package.json').version")"
          [ "$tagged" = "$packed" ] || {
            echo "tag $tagged != package $packed"; exit 1;
          }
        env:
          TAG: ${{ needs.prepare.outputs.tag }}

      - run: npm publish ./dist --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
