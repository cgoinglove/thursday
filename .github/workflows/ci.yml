name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      # Files, exports and dependencies nothing uses any more. Never with --cache:
      # a warm cache reports every Next page as unused. It reports and never fails
      # the run: several sessions share one checkout, so an export reaches a commit
      # a turn before the file that uses it, and a run red for that reads as
      # permission to delete work that is only half committed. Read the step and
      # commit what is missing instead.
      - run: pnpm knip
        continue-on-error: true

      # Every provider is mocked; none of these reaches the network.
      - run: pnpm test:live
      - run: pnpm test:bot
      - run: pnpm test:memory
      - run: pnpm test:reach
      - run: pnpm test:artifact
      - run: pnpm test:skills

      # The build is the only check that catches a client component importing
      # something server-only, and the only one that proves a release can ship.
      - run: pnpm build
