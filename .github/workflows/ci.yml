name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release runs this same check before it publishes (release.yml)
  workflow_call:

# A newer push to the same branch makes the older run pointless. Keyed by the workflow too:
# called from the release, `github.workflow` is the release's, so the two runs a push to main
# starts never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The newest Node `engines` takes, and the oldest it promises: nothing checked that a
        # release still builds and runs on 22.18
        node: [latest-in-range, "22.18"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ matrix.node == 'latest-in-range' && 'package.json' || '' }}
          node-version: ${{ matrix.node != 'latest-in-range' && matrix.node || '' }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      # Files, exports and dependencies nothing uses any more. Never with --cache:
      # a warm cache reports every Next page as unused. It reports and never fails
      # the run: several sessions share one checkout, so an export reaches a commit
      # a turn before the file that uses it, and a run red for that reads as
      # permission to delete work that is only half committed. Read the step and
      # commit what is missing instead.
      - run: pnpm knip
        continue-on-error: true

      # Every provider is mocked; none of these reaches the network.
      - run: pnpm test:live
      - run: pnpm test:bot
      - run: pnpm test:memory
      - run: pnpm test:reach
      - run: pnpm test:artifact
      - run: pnpm test:skills

      # The build is the only check that catches a client component importing
      # something server-only, and the only one that proves a release can ship.
      - run: pnpm build
