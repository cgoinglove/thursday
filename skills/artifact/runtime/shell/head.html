<!-- The parts of the head every kind has, put in by wear.mjs where a kind's page writes
     {{shell.meta}}, {{shell.who}}, {{shell.theme}}, {{shell.export}} or {{shell.download}}.
     The generator names a page the shell dressed. The app's own tab looks for it in a page's
     first bytes and leaves its bar off (app/artifact), so it stands near the top. The
     revision is new on every write, from a bot's put or a reader's save: a save that names
     one the file no longer holds was made on a page opened before the last write, and is
     refused (put.mjs, features/workspace savePage). -->

<!-- part: meta -->
<meta name="generator" content="Thursday">
<meta name="revision" content="{{revision}}">

<!-- part: who -->
<span class="sh-who" data-bot="{{bot}}"><b>{{bot}}</b></span>
<i class="sh-dot"></i>

<!-- part: theme -->
<button type="button" class="sh-b sh-icon sh-theme" data-theme-cycle aria-label="Theme">
  <svg class="sh-mode-device" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg>
  <svg class="sh-mode-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
  <svg class="sh-mode-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" /></svg>
</button>

<!-- part: export -->
<summary class="sh-b sh-outline">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4.5-4.5M12 14l-4.5-4.5M4 20h16" /></svg>
  <span class="sh-word">Export</span>
  <svg class="sh-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
</summary>

<!-- part: download -->
<button type="button" class="sh-item" data-export="html">Download this file<small>HTML</small></button>
