<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {{shell.meta}}
    <meta name="sheet-xlsx" content="{{xlsx.hash}}" />
    <title>{{title}}</title>
    <script>
      // shell.theme
    </script>
    <style>
      /* shell.css */
      /* sheet.css */
    </style>
  </head>
  <body>
    <header class="sh-head">
      {{shell.who}}
      <span class="sh-title">{{title}}</span>
      <span class="sh-sub" id="size"></span>
      <span class="sh-sub" id="state"></span>
      <span class="sh-gap"></span>
      <span class="sh-tools">
        <button type="button" class="sh-b sh-outline" data-reload title="Show the sheet as it is now" hidden>Reload</button>
        <button type="button" class="sh-b sh-outline" data-edit><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span class="sh-word">Edit</span></button>
      </span>
      {{shell.theme}}
      <details class="sh-menu">
        {{shell.export}}
        <div class="sh-list">
          <a class="sh-item" id="xlsx" href="{{xlsx.file}}" target="_blank" download>Excel file<small>.xlsx</small></a>
          <button type="button" class="sh-item" data-csv>This sheet as CSV<small>.csv</small></button>
          <button type="button" class="sh-item" data-copy-sheet>Copy this sheet<small>to paste</small></button>
          <button type="button" class="sh-item" data-export="print">Print<small>PDF</small></button>
          {{shell.download}}
        </div>
      </details>
    </header>

    <div class="ss-bar">
      <span class="ss-ref" id="ref"></span>
      <span class="ss-fx" aria-hidden="true">fx</span>
      <input class="ss-formula" id="formula" readonly spellcheck="false" autocomplete="off" aria-label="The cell's formula or value" />
      <span class="ss-tools" id="tools" hidden>
        <button type="button" class="sh-b sh-sm" data-do="row" title="A row under the one picked">+ Row</button>
        <button type="button" class="sh-b sh-sm" data-do="unrow" title="Take out the rows picked">− Row</button>
        <button type="button" class="sh-b sh-sm" data-do="col" title="A column right of the one picked">+ Column</button>
        <button type="button" class="sh-b sh-sm" data-do="uncol" title="Take out the columns picked">− Column</button>
        <select class="ss-format" id="format" aria-label="How the column's numbers read">
          <option value="General">General</option>
          <option value="0">1234</option>
          <option value="#,##0">1,234</option>
          <option value="#,##0.00">1,234.00</option>
          <option value="0%">12%</option>
          <option value="0.0%">12.3%</option>
        </select>
        <span class="sh-rule"></span>
        <button type="button" class="sh-b sh-sm sh-icon" data-do="undo" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
        <button type="button" class="sh-b sh-sm sh-icon" data-do="redo" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      </span>
    </div>
    <div class="ss-grid" id="grid" tabindex="0" aria-label="Cells">
      <table id="table"></table>
      <p class="ss-more" id="more" hidden></p>
    </div>
    <footer class="ss-foot">
      <div class="ss-tabs" id="tabs" role="tablist"></div>
      <span class="ss-gap"></span>
      <output class="ss-note" id="note"></output>
      <output class="ss-stat" id="stat"></output>
    </footer>

    <div class="ss-menu" id="menu" role="dialog" aria-label="Sort and filter" hidden>
      <button type="button" data-sort="up">Sort ascending</button>
      <button type="button" data-sort="down">Sort descending</button>
      <button type="button" data-sort="none">Rows as written</button>
      <hr />
      <input type="search" id="find" placeholder="Find a value" aria-label="Find a value" />
      <div class="ss-picks" id="picks"></div>
      <div class="ss-menu-foot">
        <button type="button" data-pick="all">Show all</button>
      </div>
    </div>

    <!-- The workbook the .xlsx beside this page holds, as spreadsheet.mjs read it -->
    <script type="application/json" id="sheet-data">null</script>
    <script>
      // shell.js
    </script>
    <script>
      // formula.mjs
      // format.mjs
      // sheet.js
    </script>
  </body>
</html>
