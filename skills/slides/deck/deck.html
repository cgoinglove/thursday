<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {{shell.meta}}
    <title>{{title}}</title>
    <script>
      // shell.theme
    </script>
    <style>
      /* shell.css */
      /* deck.css */
      /* page size */
    </style>
  </head>
  <body style="--w: {{w}}; --h: {{h}}">
    <header class="sh-head">
      {{shell.who}}
      <span class="sh-title">{{title}}</span>
      <span class="sh-sub">{{w}}×{{h}}</span>
      <span class="sh-badge" id="cut" hidden></span>
      <span class="sh-gap"></span>
      <span class="sh-tools">
        <button type="button" class="sh-b sh-icon" data-go="-1" aria-label="Previous slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <span class="sh-count"><b id="at">1</b> / <span id="of">1</span></span>
        <button type="button" class="sh-b sh-icon" data-go="1" aria-label="Next slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
        </button>
        <i class="sh-rule"></i>
        <button type="button" class="sh-b sh-icon" data-notes aria-label="Speaker notes" title="Notes (n)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 10h14M5 15h8" /></svg>
        </button>
        <button type="button" class="sh-b sh-icon" data-full aria-label="Fill the screen" title="Fill the screen (f)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" /></svg>
        </button>
        <button type="button" class="sh-b sh-outline" data-present title="Present from this slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 4 13 8-13 8Z" fill="currentcolor" stroke="none" /></svg>
          <span class="sh-word">Present</span>
        </button>
      </span>
      <i class="sh-rule"></i>
      {{shell.theme}}
      <details class="sh-menu">
        {{shell.export}}
        <div class="sh-list">
          <button type="button" class="sh-item" data-export="print">Print · one slide a page<small>PDF</small></button>
          <a class="sh-item" id="png" target="_blank" hidden>This slide as a picture<small>PNG</small></a>
          {{shell.download}}
        </div>
      </details>
    </header>

    <main id="stage">
      <div id="deck">
        <!-- One <section data-slide> per slide, in order. Every slide is exactly {{w}}x{{h}}px
             and nothing reflows: lay it out once, for that size, and keep it inside — a slide
             that overflows is refused by its number when you shoot it.
             Copy the slide you need from the skill's deck/slides/ — cover, statement, cards,
             number, table, quote, image, close — and change the words. Every style is inline
             (px and hex, no classes): references/deck.md is the whole subset, the height
             arithmetic and what makes a deck work. Set the ground, the ink and the one accent
             once and keep them the same on every slide.
             An <aside> directly inside a slide is what is said over it, shown by the Notes
             button and never on the slide. Nothing comes from the network: a picture sits
             beside this file as <img src="photo.jpg">.
             Write the slides in a file of their own and run `deck.mjs put <name> <file>`: it
             replaces what stands between the two put marks below and nothing else. Everything
             outside this <div id="deck"> is the deck's own frame: leave it as it is. -->
        <!-- put: start -->
        <section data-slide style="background:#FBFBF8; color:#1A1A1A; font-family:system-ui,sans-serif; padding:128px; display:flex; flex-direction:column; justify-content:center; gap:40px">
          <h1 style="font-size:112px; font-weight:400; line-height:1.05; max-width:1400px">{{title}}</h1>
          <p style="font-size:36px; color:#6A7179; max-width:1200px">One line on what this deck is for.</p>
          <aside>What is said over the first slide.</aside>
        </section>
        <!-- put: end -->
      </div>
    </main>

    <aside id="notes" hidden>
      <p class="sh-pane-h">Said over this slide</p>
      <div id="notes-text"></div>
    </aside>

    <footer id="strip">
      <div class="dk-strip-h">
        <span class="sh-pane-h">Slides <em id="strip-count"></em></span>
        <button type="button" class="sh-b sh-sm sh-icon" data-strip aria-label="Fold the slides away" aria-expanded="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
        </button>
      </div>
      <div class="dk-strip-row" id="thumbs"></div>
    </footer>

    <script>
      // shell.js
      // deck.js
    </script>
  </body>
</html>
