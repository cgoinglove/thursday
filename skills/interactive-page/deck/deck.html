<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      /* deck.css */
      /* page size */
    </style>
  </head>
  <body style="--w: {{w}}; --h: {{h}}">
    <main id="deck">
      <!-- One <section data-slide> per slide, in order. Every slide is exactly {{w}}x{{h}}px
           and nothing reflows: lay it out once, for that size, and keep it inside — a slide
           clips what does not fit. One idea a slide, and a title that says the point.
           Plain HTML reads well as it is (h1 h2 h3 p ul blockquote small); class="center"
           on the section centres it, and .cols / .cols.three, .card, .big and .accent lay out
           the rest. Anything else is an inline style. An <aside> directly inside a slide is
           what is said over it, shown with the n key and never on the slide.
           Nothing comes from the network: a picture sits beside this file as
           <img src="photo.jpg">. Set lang above to the deck's language. -->

      <section data-slide class="center">
        <h1>{{title}}</h1>
        <p class="muted">One line on what this deck is for.</p>
        <aside>What is said over the first slide.</aside>
      </section>

      <section data-slide>
        <h2>A title that says the point</h2>
        <p></p>
        <aside></aside>
      </section>
    </main>

    <div id="notes" hidden></div>
    <footer id="bar">
      <strong>{{title}}</strong>
      <span id="cut" hidden></span>
      <span class="spacer"></span>
      <span class="keys">← → turn · f fills the screen · n notes</span>
      <output id="at"></output>
    </footer>

    <script>
      // deck.js
    </script>
  </body>
</html>
