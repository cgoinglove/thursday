<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      /* deck.css */
      /* page size */
    </style>
  </head>
  <body style="--w: {{w}}; --h: {{h}}">
    <main id="deck">
      <!-- One <section data-slide> per slide, in order. Every slide is exactly {{w}}x{{h}}px
           and nothing reflows: lay it out once, for that size, and keep it inside — a slide
           that overflows is refused by its number when you shoot it.
           Copy the slide you need from the skill's deck/slides/ — cover, statement, cards,
           number, table, quote, image, close — and change the words. Every style is inline
           (px and hex, no classes): references/deck.md is the whole subset, the height
           arithmetic and what makes a deck work. Set the ground, the ink and the one accent
           once and keep them the same on every slide.
           An <aside> directly inside a slide is what is said over it, shown with the n key
           and never on the slide. Nothing comes from the network: a picture sits beside this
           file as <img src="photo.jpg">. Set lang above to the deck's language. -->

      <section data-slide style="background:#FBFBF8; color:#1A1A1A; font-family:system-ui,sans-serif; padding:128px; display:flex; flex-direction:column; justify-content:center; gap:40px">
        <h1 style="font-size:112px; font-weight:400; line-height:1.05; max-width:1400px">{{title}}</h1>
        <p style="font-size:36px; color:#6A7179; max-width:1200px">One line on what this deck is for.</p>
        <aside>What is said over the first slide.</aside>
      </section>
    </main>

    <div id="notes" hidden></div>
    <footer id="bar">
      <strong>{{title}}</strong>
      <span id="cut" hidden></span>
      <span class="spacer"></span>
      <span class="keys">← → turn · f fills the screen · n notes</span>
      <output id="at"></output>
    </footer>

    <script>
      // deck.js
    </script>
  </body>
</html>
