<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<script>
// shell.theme
</script>
<style>
/* shell.css */
{{css}}
</style>
</head>
<body>
<header class="sh-head">
  <span class="sh-who" data-bot="{{bot}}"><b>{{bot}}</b></span>
  <i class="sh-dot"></i>
  <span class="sh-title">{{title}}</span>
  <span class="sh-sub" id="state"></span>
  <span class="sh-gap"></span>
  <span class="sh-tools">
    <button type="button" class="sh-b sh-icon" data-outline aria-label="Contents" title="Contents">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    </button>
    <button type="button" class="sh-b sh-outline" data-edit>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span class="sh-word">Edit</span>
    </button>
  </span>
  <i class="sh-rule"></i>
  <button type="button" class="sh-b sh-icon" data-theme-cycle aria-label="Theme">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentcolor" stroke="none"/></svg>
  </button>
  <details class="sh-menu">
    <summary class="sh-b sh-outline">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4.5-4.5M12 14l-4.5-4.5M4 20h16"/></svg>
      <span class="sh-word">Export</span>
      <svg class="sh-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <div class="sh-list">
      <button type="button" class="sh-item" data-export="print">Print<small>PDF</small></button>
      <button type="button" class="sh-item" data-export="html">Download this file<small>HTML</small></button>
    </div>
  </details>
</header>

<div class="sh-page">
  <nav class="sh-pane sh-toc" id="outline" aria-label="Contents"></nav>
  <main class="sh-paper" id="paper">
{{body}}
  </main>
</div>

<div id="grip" hidden>
  <button type="button" class="sh-b sh-sm sh-icon" data-block-menu aria-label="Block"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.4" fill="currentcolor" stroke="none"/><circle cx="15" cy="6" r="1.4" fill="currentcolor" stroke="none"/><circle cx="9" cy="12" r="1.4" fill="currentcolor" stroke="none"/><circle cx="15" cy="12" r="1.4" fill="currentcolor" stroke="none"/><circle cx="9" cy="18" r="1.4" fill="currentcolor" stroke="none"/><circle cx="15" cy="18" r="1.4" fill="currentcolor" stroke="none"/></svg></button>
  <button type="button" class="sh-b sh-sm sh-icon" data-insert-menu aria-label="Insert after"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div id="bubble" class="sh-bubble" hidden>
  <button type="button" class="sh-b sh-sm" data-fmt="h2"><b>H2</b></button>
  <button type="button" class="sh-b sh-sm" data-fmt="p" title="Paragraph">¶</button>
  <button type="button" class="sh-b sh-sm" data-fmt="bold"><b>B</b></button>
  <button type="button" class="sh-b sh-sm" data-fmt="italic"><i>I</i></button>
  <button type="button" class="sh-b sh-sm sh-icon" data-fmt="link" aria-label="Link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 0 0-5.7-5.7L11 6.3"/><path d="M14 11a4 4 0 0 0-5.7 0l-2.6 2.6a4 4 0 0 0 5.7 5.7L13 17.7"/></svg></button>
  <i class="sh-rule"></i>
  <button type="button" class="sh-b sh-sm" data-fmt="chip">chip</button>
</div>
<div id="block-menu" class="sh-list sh-popover" hidden>
  <button type="button" class="sh-item" data-block="up">Move up</button>
  <button type="button" class="sh-item" data-block="down">Move down</button>
  <button type="button" class="sh-item" data-block="dup">Duplicate</button>
  <div class="sh-sep"></div>
  <button type="button" class="sh-item" data-block="delete">Delete</button>
</div>
<div id="insert-menu" class="sh-list sh-popover" hidden>
  <button type="button" class="sh-item" data-add="h2">Heading</button>
  <button type="button" class="sh-item" data-add="p">Paragraph</button>
  <button type="button" class="sh-item" data-add="ul">Bulleted list</button>
  <button type="button" class="sh-item" data-add="ol">Numbered list</button>
  <button type="button" class="sh-item" data-add="check">Checklist</button>
  <button type="button" class="sh-item" data-add="table">Table</button>
  <button type="button" class="sh-item" data-add="note">Note</button>
  <button type="button" class="sh-item" data-add="hr">Divider</button>
</div>

<script>
// shell.js
{{js}}
</script>
</body>
</html>
